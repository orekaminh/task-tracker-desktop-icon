<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#249675"/>
      <stop offset="1" stop-color="#125944"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner highlight at top -->
  <rect width="512" height="200" rx="112" fill="white" opacity="0.04"/>

  <!-- Main symbol: Checkmark -->
  <g filter="url(#glow)">
    <path d="M 120 260 L 210 350 L 390 170"
          fill="none" stroke="white" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
