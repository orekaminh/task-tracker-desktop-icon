<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Task Tracker Business</title>

  <!-- PWA: icon đẹp + chạy toàn màn hình khi "Thêm vào màn hình chính" -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#6a1730">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Task Pro">
  <link rel="icon" type="image/png" href="icon.PNG">
  <!-- iOS dùng PNG cho icon home-screen; nếu muốn icon nét trên iPhone, xem README (tạo icon-180.png). -->
  <link rel="apple-touch-icon" href="icon.PNG">

  <style>
    html, body { margin: 0; height: 100%; background: #6a1730; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
    #splash { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; background: #6a1730; color: #fff;
      transition: opacity .45s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .spin { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fallback { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; z-index: 3; }
    #fallback a { color: #fff; opacity: .7; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <!-- ════════════════════════════════════════════════════════════════
       ⚙️ DÁN LINK /exec CỦA BẢN WEB APP VÀO ĐÂY (mỗi khách 1 link riêng).
       Lấy ở: Apps Script của khách → Triển khai → Quản lý bản triển khai → URL /exec.
       ════════════════════════════════════════════════════════════════ -->
  <script>
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id') || localStorage.getItem('khach_id');
  if (id) {
      localStorage.setItem('khach_id', id);
      var APP_URL = "https://script.google.com/macros/s/" + id + "/exec";
  } else {
      alert("Đường link thiếu ID của bạn!");
  }
  </script>

  <div id="splash"><img src="icon.PNG" alt="Task Pro"><div class="spin"></div></div>
  <iframe id="app" title="Task Tracker Business" allow="clipboard-write; clipboard-read"></iframe>
  <div id="fallback"><a id="openDirect" target="_blank" rel="noopener">Không hiển thị được? Mở trực tiếp →</a></div>

  <script>
    (function () {
      var f = document.getElementById("app"), splash = document.getElementById("splash");
      document.getElementById("openDirect").href = APP_URL;
      f.src = APP_URL;
      f.addEventListener("load", function () { splash.classList.add("hide"); });
      // Lưới an toàn: nếu iframe không bắn 'load' (vài trình duyệt), vẫn ẩn splash sau 6s.
      setTimeout(function () { splash.classList.add("hide"); }, 6000);
    })();
  </script>
</body>
</html>
